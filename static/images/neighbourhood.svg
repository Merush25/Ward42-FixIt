       stroke-width="10"
       stroke-linecap="round"
       fill="none">
        <path d="M50 125 H125"/>
        <path d="M90 125 V225"/>
    </g>

    <circle cx="125" cy="125"
            r="10" fill="#B9532B"/>

    <!-- Road -->
    <path d="M0 340
             L420 250
             H580
             L1000 340 Z"
          fill="#77756F"/>

    <!-- Road centre markings -->
    <path d="M500 262 V340"
          stroke="#F7DF9D"
          stroke-width="9"
          stroke-dasharray="25 15"/>

</svg>
