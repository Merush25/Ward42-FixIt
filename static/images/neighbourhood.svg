
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 340">

    <!-- Neighbourhood skyline -->
    <path fill="#D8BBA2"
          d="M0 250
             H85 V190 H160 V225
             H210 V145 H300 V220
             H350 V105 H450 V220
             H500 V175 H570 V250
             H620 V160 H710 V225
             H760 V185 H830 V225
             H885 V135 H970 V225
             H1000 V340 H0 Z"/>

    <!-- Construction symbol -->
