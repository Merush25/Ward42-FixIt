
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Ward 42 Fix-It{% endblock %}
    </title>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Street Smart Mamelodi Theme -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">


    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.webmanifest') }}">


    <!-- PWA Theme Colour -->
    <meta
        name="theme-color"
        content="#B9532B">


    <!-- Application Icon -->
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='icons/icon-192.png') }}">


    <!-- Service Worker Registration -->
    <script
        src="{{ url_for('static', filename='js/pwa.js') }}"
        defer>
    </script>

</head>


<body>

    <!-- Keyboard Accessibility -->
    <a href="#main-content"
       class="visually-hidden-focusable position-absolute top-0 start-0 bg-white p-3">
        Skip to Main Content
    </a>

    <!-- Website Header -->
    <header class="site-header">

        <div class="container header-content
                    d-flex flex-wrap
                    align-items-center
                    justify-content-between
                    gap-3 py-3">

            <!-- Branding -->
            <a href="{{ url_for('home') }}"
               class="d-inline-flex align-items-center
                      gap-2 text-decoration-none"
               style="color: var(--charcoal);">

                <span class="brand-icon"
                      aria-hidden="true">
                    42
                </span>

                <span class="h4 mb-0 fw-bold">
                    WARD 42 FIX-IT
                </span>

            </a>


            <!-- Navigation -->
            <nav class="header-links"
                 aria-label="Main navigation">

                <a href="{{ url_for('home') }}"
                   class="nav-link-custom">
                    Home
                </a>

                <a href="{{ url_for('report_fault') }}"
                   class="nav-link-custom">
                    Report a Fault
                </a>

                <a href="{{ url_for('check_status') }}"
                   class="nav-link-custom">
                    Check Status
                </a>

            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main id="main-content"
          class="container my-4">
            tabindex="-1">
            
        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="site-footer bg-dark
                   text-white text-center py-3">

        <div class="container">

            <p class="mb-0">
                Ward 42 Fix-It |
                Community Reporting System
            </p>

        </div>

    </footer>

</body>

</html>
